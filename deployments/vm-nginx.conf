# ==============================================================================
# Nginx Reverse Proxy Configuration for Slides App on Host VM (167.86.122.141)
# Place at: /etc/nginx/sites-available/slides.conf
# Enable:   ln -sf /etc/nginx/sites-available/slides.conf /etc/nginx/sites-enabled/
# Test:     nginx -t && systemctl reload nginx
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. PRODUCTION STACK (slides-prod)
#    Frontend: 127.0.0.1:3000
#    Backend:  127.0.0.1:3500
# ------------------------------------------------------------------------------
upstream slides_prod_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream slides_prod_backend {
    server 127.0.0.1:3500;
    keepalive 32;
}

server {
    listen 80;
    server_name 167.86.122.141; # Or your production domain, e.g. slides.yourdomain.com

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    location = /health {
        proxy_pass http://slides_prod_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        proxy_pass http://slides_prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    location /uploads/ {
        proxy_pass http://slides_prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://slides_prod_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ------------------------------------------------------------------------------
# 2. DEVELOPMENT STACK (slides-dev)
#    Frontend: 127.0.0.1:3001
#    Backend:  127.0.0.1:3501
#    Accessed on port 8080 or dev subdomain
# ------------------------------------------------------------------------------
upstream slides_dev_frontend {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream slides_dev_backend {
    server 127.0.0.1:3501;
    keepalive 32;
}

server {
    listen 8080;
    server_name 167.86.122.141; # Or dev.slides.yourdomain.com

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    location = /health {
        proxy_pass http://slides_dev_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        proxy_pass http://slides_dev_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        proxy_pass http://slides_dev_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        proxy_pass http://slides_dev_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
